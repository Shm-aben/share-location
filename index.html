

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

 
  <title>مختبر اختبار الكاميرا</title>

  <style>

    body {

      font-family: sans-serif;

      text-align: center;

      padding: 25px;

      background: #f3f5f8;

    }

    button {

      padding: 13px 20px;

      margin: 8px;

      border: 0;

      border-radius: 9px;

      background: #1769aa;

      color: white;

      font-size: 16px;

    }

    video, canvas {

      width: 100%;

      max-width: 350px;

      border-radius: 12px;

      margin-top: 15px;

    }

    #status {

      white-space: pre-line;

      line-height: 2;

    }

  </style>

</head>

<body>

  <h2>مختبر اختبار الكاميرا</h2>

  <p>هذه تجربة تعليمية لا تستخدم الكاميرا إلا بعد موافقتك.</p>

  <h3>1. معلومات الزيارة</h3>

  <p id="visit"></p>

  <p id="support"></p>

  <h3>2. اختبار الكاميرا</h3>

  <button id="start">طلب إذن الكاميرا</button>

  <p id="status">لم يتم طلب الإذن بعد.</p>

  <video id="video" autoplay playsinline hidden></video>

  <br>

  <button id="capture" hidden>التقاط صورة</button>

  <canvas id="canvas" hidden></canvas>

  <br>

  <a id="save" hidden download="my-test-photo.png">

    حفظ الصورة على الهاتف

  </a>

  <script>

    const status = document.getElementById('status');

    const video = document.getElementById('video');

    const capture = document.getElementById('capture');

    const canvas = document.getElementById('canvas');

    const save = document.getElementById('save');

    document.getElementById('visit').textContent =

      'وقت فتح الصفحة: ' + new Date().toLocaleString('ar');

    const supported =

      !!(navigator.mediaDevices &&

         navigator.mediaDevices.getUserMedia);

    document.getElementById('support').textContent =

      'دعم الكاميرا: ' + (supported ? 'متاح' : 'غير متاح');

    document.getElementById('start').onclick = async () => {

      if (!supported) {

        status.textContent = 'الكاميرا غير مدعومة أو الصفحة ليست على اتصال آمن HTTPS.';

        return;

      }

      try {

        const stream = await navigator.mediaDevices.getUserMedia({

          video: { facingMode: 'user' },

          audio: false

        });

        video.srcObject = stream;

        video.hidden = false;

        capture.hidden = false;

        status.textContent =

          'تم منح إذن الكاميرا: ' + new Date().toLocaleString('ar');

      } catch (error) {

        status.textContent =

          'لم يتم منح الإذن أو تعذر تشغيل الكاميرا: ' + error.name;

      }

    };

    capture.onclick = () => {

      canvas.width = video.videoWidth;

      canvas.height = video.videoHeight;

      canvas.getContext('2d').drawImage(

        video, 0, 0, canvas.width, canvas.height

      );

      canvas.toBlob(blob => {

        if (!blob) return;

        save.href = URL.createObjectURL(blob);

        save.hidden = false;

        status.textContent = 'التُقطت الصورة. اضغط حفظ الصورة لتنزيلها.';

      }, 'image/png');

    };

  </script>

</body>

</html>
