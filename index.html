

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Share Location</title>

  <style>

    body {

      font-family: sans-serif;

      text-align: center;

      padding: 25px;

      background: #f3f5f8;

      color: #222;

    }

    .container {

      max-width: 450px;

      margin: 50px auto;

      padding: 25px;

      background: white;

      border-radius: 15px;

      box-shadow: 0 3px 15px #00000012;

    }

    h2 { color: #1769aa; }

    #status { line-height: 2; }

  </style>

</head>

<body>

  <div class="container">

    <h2>Share Location</h2>

    <p>يجمع الموقع معلومات تقنية أساسية عن الزيارة ويحفظها في قاعدة البيانات.</p>

    <p id="status">جارٍ الاتصال...</p>

  </div>

  <script type="module">

    import { initializeApp } from

      "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

    import {

      getDatabase, ref, push, set

    } from

      "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    import {

      getAuth, signInAnonymously

    } from

      "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

    const firebaseConfig = {

      apiKey: "AIzaSyBbIWw3akH0cOsjkULPzfdek8JZHB2n2Bo",

      authDomain: "share-location-d9ce6.firebaseapp.com",

      databaseURL: "ضع_رابط_قاعدة_البيانات_هنا",

      projectId: "share-location-d9ce6",

      storageBucket: "share-location-d9ce6.firebasestorage.app",

      messagingSenderId: "1053862254030",

      appId: "1:1053862254030:web:52a90573635b613072479f",

      measurementId: "G-6JTHY4RDVP"

    };

    const status = document.getElementById("status");

    async function recordVisit() {

      try {

        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        const auth = getAuth(app);

        await signInAnonymously(auth);

        const visitData = {

          visitedAt: new Date().toISOString(),

          language: navigator.language || "unknown",

          timezone:

            Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown",

          screenWidth: screen.width,

          screenHeight: screen.height,

          userAgent: navigator.userAgent || "unknown"

        };

        const visitRef = push(ref(database, "visits"));

        await set(visitRef, visitData);

        status.textContent = "تم تسجيل الزيارة بنجاح.";

      } catch (error) {

        console.error(error);

        status.textContent = "تعذر الاتصال بقاعدة البيانات.";

      }

    }

    recordVisit();

  </script>

</body>

</html>
